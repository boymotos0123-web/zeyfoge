name: Release (Windows · Linux · macOS · Android · Web)

# Para gerar os instaladores: Actions → "Release" → Run workflow
# (ou crie uma tag:  git tag v0.2.0 && git push origin v0.2.0). O rascunho aparece em Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ZeyForge v__VERSION__'
          releaseBody: 'Instaladores para Windows (.msi/.exe), Linux (.deb/.AppImage/.rpm), macOS (.dmg) e Android (.apk). Versão web: zeyforge-web.zip.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Versão
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk ZeyForge-${{ steps.ver.outputs.tag }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zeyforge-android
          path: ZeyForge-*.apk
      - name: Anexar ao release
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.ver.outputs.tag }}" --draft --title "ZeyForge ${{ steps.ver.outputs.tag }}" --target "${{ github.sha }}"
          gh release upload "${{ steps.ver.outputs.tag }}" ZeyForge-*.apk --clobber

  web:
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:zip
      - uses: actions/upload-artifact@v4
        with:
          name: zeyforge-web-zip
          path: zeyforge-web.zip
      - name: Anexar ao release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "ZeyForge $TAG" --target "${{ github.sha }}"
          gh release upload "$TAG" zeyforge-web.zip --clobber
